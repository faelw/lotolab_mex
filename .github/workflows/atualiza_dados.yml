name: Atualizar Resultados Melate

on:
  schedule:
    # Agendado para rodar a cada 6 horas
    # Caso prefira horários específicos em UTC, use ex: '0 10,18,22 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite que você acione o script manualmente através da aba Actions

jobs:
  scraper_melate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml

      - name: 🚀 Executar Script
        run: python scripts/atualiza_melate.py

      - name: 💾 Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_mexico.json data/resumo_tela_principal.json
          
          # Caso não existam novos concursos, evita que o workflow falhe por não ter arquivos novos pra "commitar"
          git commit -m "🤖 Rotina: Atualiza resultados mais recentes do Melate" || exit 0
          git push
